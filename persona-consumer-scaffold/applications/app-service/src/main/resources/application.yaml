server:
  port: 8081
spring:
  application:
    name: "persona-consumer-scaffold"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: personas-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: manual_immediate

# Configuración del ErrorHandler para reintentos y DLT
# Esta configuración se aplicará a todos los listeners
spring.kafka.listener.common-error-handler.enabled: true
spring.kafka.listener.common-error-handler.dlt-name: personas-topic.DLT
spring.kafka.listener.common-error-handler.back-off: 1000
spring.kafka.listener.common-error-handler.max-failures: 2

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  kafka:
    consumer:
      topic: "test"
